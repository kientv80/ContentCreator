spring:
  datasource:
    url: jdbc:h2:mem:cc;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
contentcreator:
  news:
    file-worker:
      enabled: false
      directory: /nonexistent
      poll-seconds: 3600
      settle-seconds: 0
      max-bytes: 100000
    worker:
      enabled: false
      cron: "0 0 0 1 1 *"
      zone: Asia/Ho_Chi_Minh
      run-on-startup: false
      max-items: 10
  thoughts:
    enabled: false
    directory: /nonexistent
    poll-seconds: 3600
    settle-seconds: 0
    max-bytes: 200000
    accounts:
      vi: elderfriend_ai_vn
      en: elderfriend_ai_us
  claude:
    api-key: test-key
    base-url: http://claude.test
    model: test-model
    max-tokens: 100
    web-search-max-uses: 1
    web-search-tool-type: web_search_20250305
    timeout-seconds: 5
