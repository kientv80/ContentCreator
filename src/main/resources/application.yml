server:
  port: 8110

spring:
  application:
    name: contentcreator
  datasource:
    # ElderEase's own database: ContentCreator inserts unpublished rows into its existing news_summary table.
    # Use a MySQL user that has only SELECT and INSERT on news_summary (see README).
    url: ${CONTENTCREATOR_DB_URL:jdbc:mysql://localhost:3307/elderfriend?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${CONTENTCREATOR_DB_USER:contentcreator}
    password: ${CONTENTCREATOR_DB_PASSWORD:}

contentcreator:
  news:
    file-worker:
      enabled: ${CONTENTCREATOR_FILE_WORKER_ENABLED:true}
      # New *.json bulletins in this folder become unpublished drafts; done files move to processed/, bad ones to failed/.
      directory: ${CONTENTCREATOR_NEWS_DIR:${user.home}/Downloads/newssummary}
      poll-seconds: 30
      # A file must be this old (not modified for this long) before it is read, so half-written files are skipped.
      settle-seconds: 5
      max-bytes: 2000000
    collect:
      # A story's site must also be one Google Search reported (set false only if grounding returns no publisher domains).
      require-grounding: ${CONTENTCREATOR_NEWS_REQUIRE_GROUNDING:true}
      # The same normalized title for the same country within this many days is a duplicate (FR-506).
      title-dedupe-days: ${CONTENTCREATOR_NEWS_TITLE_DEDUPE_DAYS:7}
      # The Gemini collection worker's own schedule (Spring cron, 6 fields): every hour on the hour, UTC.
      # The Claude worker keeps its own contentcreator.news.worker.cron below.
      cron: "0 0 * * * *"
      zone: UTC
    worker:
      # The API collector: provider gemini (default: hourly per country and category, key saved on the admin page or GEMINI_API_KEY)
      # or claude (needs ANTHROPIC_API_KEY). Off by default; run-on-startup is shared by both.
      provider: ${CONTENTCREATOR_NEWS_PROVIDER:gemini}
      enabled: ${CONTENTCREATOR_API_WORKER_ENABLED:false}
      # Claude worker only: Spring cron (6 fields), Vietnam time: 06:00, 12:00 and 18:00 every day.
      cron: "0 0 6,12,18 * * *"
      zone: Asia/Ho_Chi_Minh
      run-on-startup: ${CONTENTCREATOR_RUN_ON_STARTUP:false}
      max-items: 10
    intake:
      # News intake API (POST /api/v1/news-bulletins). Empty hash = endpoint disabled (404). Set it to the SHA-256 hex of the token,
      # never the token itself (see README, "News intake API").
      token-sha256: ${NEWS_INTAKE_TOKEN_SHA256:}
      # Address ranges (CIDR, comma-separated) whose calls need no token, e.g. Anthropic's 160.79.104.0/21. Empty = token only.
      allowed-cidrs: ${NEWS_INTAKE_ALLOWED_CIDRS:}
      # true only behind Caddy: the client address is then the right-most X-Forwarded-For value.
      trust-proxy: ${NEWS_INTAKE_TRUST_PROXY:false}
      max-bytes: 2000000
      per-hour: 30
  thoughts:
    enabled: ${CONTENTCREATOR_THOUGHT_WORKER_ENABLED:true}
    # Letters named yyyy-MM-dd-vi.md / yyyy-MM-dd-en.md become PENDING Shared Thoughts; done files move to processed/,
    # bad ones to failed/, other names to skipped/.
    directory: ${CONTENTCREATOR_POSTS_DIR:${user.home}/Documents/Elderfriend Posts}
    poll-seconds: 60
    settle-seconds: 5
    max-bytes: 200000
    accounts:
      vi: elderfriend_ai_vn
      en: elderfriend_ai_us
  gemini:
    # Fallback key, used when no key is saved on the admin page. Never commit it: set GEMINI_API_KEY in the environment.
    # The saved key is decrypted with NEWS_COLLECTION_SECRET_KEY (base64 of 32 bytes), read straight from the environment.
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    max-tokens: 8000
    timeout-seconds: 180
  claude:
    # Never commit the key: set ANTHROPIC_API_KEY in the environment.
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: https://api.anthropic.com
    model: claude-sonnet-5-5
    max-tokens: 8000
    web-search-max-uses: 8
    web-search-tool-type: web_search_20250305
    timeout-seconds: 180

management:
  endpoints:
    web:
      exposure:
        include: health
