server:
  port: 8110

spring:
  application:
    name: contentcreator
  datasource:
    url: ${CONTENTCREATOR_DB_URL:jdbc:mysql://localhost:3307/contentcreator?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${CONTENTCREATOR_DB_USER:root}
    password: ${CONTENTCREATOR_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

contentcreator:
  news:
    worker:
      enabled: true
      # Spring cron (6 fields), Vietnam time: every 3 hours from 06:00 to 21:00.
      cron: "0 0 6-21/3 * * *"
      zone: Asia/Ho_Chi_Minh
      run-on-startup: false
      max-items: 10
      # Summaries older than this are removed after each run.
      retention-days: 30
  claude:
    # Never commit the key: set ANTHROPIC_API_KEY in the environment.
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: https://api.anthropic.com
    model: claude-sonnet-5-5
    max-tokens: 8000
    web-search-max-uses: 8
    web-search-tool-type: web_search_20250305
    timeout-seconds: 180

management:
  endpoints:
    web:
      exposure:
        include: health
