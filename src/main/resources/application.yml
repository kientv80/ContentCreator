server:
  port: 8110

spring:
  application:
    name: contentcreator
  datasource:
    # ElderEase's own database: ContentCreator inserts unpublished rows into its existing news_summary table.
    # Use a MySQL user that has only SELECT and INSERT on news_summary (see README).
    url: ${CONTENTCREATOR_DB_URL:jdbc:mysql://localhost:3307/elderfriend?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${CONTENTCREATOR_DB_USER:contentcreator}
    password: ${CONTENTCREATOR_DB_PASSWORD:}

contentcreator:
  news:
    worker:
      enabled: true
      # Spring cron (6 fields), Vietnam time: 06:00, 12:00 and 18:00 every day.
      cron: "0 0 6,12,18 * * *"
      zone: Asia/Ho_Chi_Minh
      run-on-startup: ${CONTENTCREATOR_RUN_ON_STARTUP:false}
      max-items: 10
  claude:
    # Never commit the key: set ANTHROPIC_API_KEY in the environment.
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: https://api.anthropic.com
    model: claude-sonnet-5-5
    max-tokens: 8000
    web-search-max-uses: 8
    web-search-tool-type: web_search_20250305
    timeout-seconds: 180

management:
  endpoints:
    web:
      exposure:
        include: health
